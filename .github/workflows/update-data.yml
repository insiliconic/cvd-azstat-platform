name: Update circulatory data

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  NOTIFY_TO: insiliconic@gmail.com

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to push the updated JSON
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A non-zero exit (download error, non-.xls response, missing pattern,
      # any exception) fails the job and triggers the failure e-mail below.
      - name: Download sources and parse
        run: python parser.py --download

      - name: Compare with last committed version
        id: compare
        run: python compare_data.py --out-json changes.json --out-md changes.md

      - name: Commit and push updated data
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/circulatory_data.json raw_data/
          git commit -m "Data update: ${{ steps.compare.outputs.count }} value(s) changed"
          git push

      - name: E-mail the changes
        if: steps.compare.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: CVD AzStat bot <${{ secrets.SMTP_USER }}>
          to: ${{ env.NOTIFY_TO }}
          subject: "[cvd-azstat] ${{ steps.compare.outputs.count }} value(s) changed on stat.gov.az"
          html_body: file://changes.md
          convert_markdown: true
          attachments: changes.json

      - name: E-mail the failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: CVD AzStat bot <${{ secrets.SMTP_USER }}>
          to: ${{ env.NOTIFY_TO }}
          subject: "[cvd-azstat] data update FAILED"
          body: |
            The scheduled data update failed.

            Workflow: ${{ github.workflow }}
            Trigger:  ${{ github.event_name }}
            Commit:   ${{ github.sha }}
            Logs:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Publishes data/circulatory_data.json on GitHub Pages so a fixed public
  # URL always serves the latest committed data (see docs/methodology_log.md).
  # Runs after every successful "update" job, whether or not the data
  # changed, so Pages is populated from the very first run too.
  deploy:
    needs: update
    if: needs.update.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # main, not github.sha: the update job may have just pushed a new
      # commit (the data revision), and we want to publish that one.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build Pages site
        run: |
          set -e
          mkdir -p site/data
          cp data/circulatory_data.json site/data/circulatory_data.json
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>cvd-azstat-platform data</title></head>
          <body>
            <h1>cvd-azstat-platform</h1>
            <p>Circulatory-disease data extracted from stat.gov.az:</p>
            <p><a href="data/circulatory_data.json">data/circulatory_data.json</a></p>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
